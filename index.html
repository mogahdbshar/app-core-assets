<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Dastur TV</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        #loader { margin-top: 50px; font-size: 1.2em; }
        .channel-list { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        .channel-item { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="loader">جاري تهيئة النظام...</div>
    <div id="channel-container" class="channel-list"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    <script>
        const CONFIG = {
            DATA_URL: "https://raw.githubusercontent.com/mogahdbshar/app-core-assets/refs/heads/main/system_config.dat",
            SECRET_KEY: "MySecretKeyForIPTVChannels4000!!",
            IV: "16BytesLongIV!!!"
        };

        async function init() {
            try {
                const response = await fetch(CONFIG.DATA_URL);
                const encrypted = await response.text();
                
                // فك التشفير
                const key = CryptoJS.enc.Utf8.parse(CONFIG.SECRET_KEY);
                const iv = CryptoJS.enc.Utf8.parse(CONFIG.IV);
                const decrypted = CryptoJS.AES.decrypt(encrypted.trim(), key, { iv: iv });
                
                // تحويل لـ Uint8Array لفك الضغط
                const binary = atob(decrypted.toString(CryptoJS.enc.Base64));
                const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
                
                // فك الضغط
                const jsonText = pako.ungzip(bytes, { to: 'string' });
                const channels = JSON.parse(jsonText);

                document.getElementById('loader').innerText = "تم التحميل بنجاح!";
                
                // عرض أول 50 قناة فقط لتجنب التعليق
                const container = document.getElementById('channel-container');
                channels.slice(0, 50).forEach(ch => {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.innerText = ch.name || "قناة بدون اسم";
                    container.appendChild(div);
                });

            } catch (e) {
                document.getElementById('loader').innerText = "خطأ: " + e.message;
            }
        }
        init();
    </script>
</body>
</html>
